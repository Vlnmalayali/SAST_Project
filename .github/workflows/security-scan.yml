name: SAST Security Scan

on:
  workflow_call:
    inputs:
      api-url:
        required: true
        type: string
      project-id:
        required: true
        type: string
    secrets:
      api-token:
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source code
        run: |
          zip -r source.zip . -x '.git/*' 'node_modules/*' '__pycache__/*' '.venv/*'

      - name: Trigger scan
        id: scan
        run: |
          RESPONSE=$(curl -s -X POST "${{ inputs.api-url }}/api/v1/projects/${{ inputs.project-id }}/scans" \
            -H "Authorization: Bearer ${{ secrets.api-token }}" \
            -F "file=@source.zip" \
            -F "scan_type=ci_cd")
          SCAN_ID=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "scan_id=$SCAN_ID" >> $GITHUB_OUTPUT

      - name: Wait for scan completion
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -s "${{ inputs.api-url }}/api/v1/scans/${{ steps.scan.outputs.scan_id }}/status" \
              -H "Authorization: Bearer ${{ secrets.api-token }}" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "Scan status: $STATUS (attempt $i/60)"
            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "failed" ]; then
              break
            fi
            sleep 10
          done

      - name: Check results
        run: |
          RESULT=$(curl -s "${{ inputs.api-url }}/api/v1/scans/${{ steps.scan.outputs.scan_id }}" \
            -H "Authorization: Bearer ${{ secrets.api-token }}")
          echo "$RESULT" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(f'Risk Score: {data[\"overall_risk_score\"]}')
          print(f'Critical: {data[\"critical_count\"]}')
          print(f'High: {data[\"high_count\"]}')
          if data['critical_count'] > 0:
              print('::error::Critical vulnerabilities found!')
              sys.exit(1)
          "